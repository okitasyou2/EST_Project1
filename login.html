<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | Game Opportunity Radar</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase-client.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body data-page="login">
  <header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-icon">◎</span><span>GAME OPPORTUNITY <strong>RADAR</strong></span></a><nav><a href="index.html">게임 발굴</a></nav></div></header>
  <main class="wrap auth-page">
    <section class="panel auth-panel">
      <div class="eyebrow">YOUR ACCOUNT</div>
      <h1 id="auth-title">로그인<span class="accent">.</span></h1>
      <p class="muted" id="auth-description">이메일과 비밀번호로 로그인하세요.</p>
      <form id="auth-form">
        <label for="auth-email">이메일</label><input id="auth-email" type="email" autocomplete="email" required>
        <label for="auth-password">비밀번호</label><input id="auth-password" type="password" autocomplete="current-password" required minlength="6">
        <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
        <button id="auth-submit" class="button primary" type="submit">로그인</button>
      </form>
      <p class="auth-switch"><span id="auth-switch-copy">계정이 없으신가요?</span> <button id="auth-switch" class="text-button" type="button">회원가입</button></p>
    </section>
  </main>
</body>
</html>
